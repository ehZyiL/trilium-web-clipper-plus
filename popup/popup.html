<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trilium Web Clipper Plus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="app-header">
      <div class="brand">
        <img src="../icons/logo3_48x48.png" alt="" class="brand-icon">
        <div>
          <div class="brand-title" data-i18n="app_title">Trilium Web Clipper Plus</div>
          <div class="brand-subtitle" id="page-domain">当前页面</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-button" id="show-options-button" type="button" data-i18n="options" data-i18n-attr="title,aria-label" data-i18n-text="false" title="Options" aria-label="Options">⚙</button>
        <button class="icon-button" id="show-help-button" type="button" data-i18n="help" data-i18n-attr="title,aria-label" data-i18n-text="false" title="Help" aria-label="Help">?</button>
      </div>
    </header>

    <section class="connection-card" aria-live="polite">
      <span class="status-dot" id="connection-dot"></span>
      <div>
        <div class="connection-label" id="connection-label" data-i18n="unknown">unknown</div>
        <div class="connection-detail" id="connection-detail"></div>
      </div>
      <button class="text-button" id="check-connection-button" type="button" data-i18n="check">Check</button>
    </section>

    <section class="page-card">
      <div class="page-card-heading" data-i18n="current_page">Current page</div>
      <div class="page-title" id="page-title">正在读取当前页面…</div>
      <div class="capture-hint" id="capture-hint">正在检测选区…</div>
      <div id="already-visited" class="visited-state hidden"></div>
    </section>

    <section class="primary-actions">
      <button class="button primary full needs-connection" id="save-whole-page-button" type="button">
        <span class="button-icon">↓</span>
        <span id="save-page-label" data-i18n="save_whole_page">Save whole page</span>
      </button>
      <div class="action-grid">
        <button class="button secondary needs-connection" id="save-selection-button" type="button" data-i18n="save_selection">Save selection</button>
        <button class="button secondary needs-connection" id="save-cropped-screenshot-button" type="button" data-i18n="crop_screenshot">Crop screenshot</button>
      </div>
    </section>

    <details class="more-actions">
      <summary data-i18n="more_actions">More actions</summary>
      <div class="more-actions-list">
        <button class="button ghost needs-connection" id="save-whole-screenshot-button" type="button" data-i18n="save_whole_screenshot">Save whole screenshot</button>
        <button class="button ghost needs-connection" id="save-link-with-note-button" type="button" data-i18n="save_link_with_note">Save link with a note</button>
        <button class="button ghost needs-connection" id="save-tabs-button" type="button" data-i18n="save_tabs">Save window's tabs as a list</button>
      </div>
    </details>

    <section id="save-link-with-note-wrapper" class="note-editor hidden">
      <label for="save-link-with-note-textarea" data-i18n="note_content">Note content</label>
      <textarea id="save-link-with-note-textarea" rows="5"></textarea>
      <label class="checkbox-row"><input type="checkbox" id="keep-title-checkbox"> <span data-i18n="keep_title_checkbox">Keep page title as note title</span></label>
      <div class="editor-actions">
        <button class="button primary" id="save-button" type="button" data-i18n="save">Save</button>
        <button class="button secondary" id="cancel-button" type="button" data-i18n="cancel">Cancel</button>
      </div>
    </section>

    <div class="status-message hidden" id="popup-status" role="status" aria-live="polite"></div>

    <footer class="popup-footer">
      <span data-i18n="app_title">Trilium Web Clipper Plus</span>
      <span id="busy-indicator" class="busy-indicator hidden">●</span>
    </footer>
  </main>

  <script src="../lib/browser-polyfill.js"></script>
  <script src="../i18n/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
